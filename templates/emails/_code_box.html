<!-- templates/emails/_code_box.html — the large one-time code, shared by OTP emails. Expects `code`. -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:24px 0;">
    <tr>
        <td align="center" style="background-color:#E8F8F2; border:1px dashed #02C897; border-radius:12px; padding:20px;">
            <div style="font-family:'Courier New', Courier, monospace; font-size:36px; font-weight:700; letter-spacing:10px; color:#028A67;">{{ code }}</div>
        </td>
    </tr>
</table>
